# Identifies Claims Service in Eureka and assigns its local port.
spring.application.name=CLAIMS-SERVICE
server.port=8086

# Persistent reactive H2 database.
spring.r2dbc.url=r2dbc:h2:file:///./data/claimsdb
spring.r2dbc.username=sa
spring.r2dbc.password=

# Executes schema.sql during application startup.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# Eureka registration and service discovery.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT validation settings shared with Identity Service.
jwt.secret=thisismysecuresecretkeyfortwinsurejwtgeneration123456789
jwt.cookie.name=TWINSURE_TOKEN

# Actuator monitoring endpoints.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application information exposed through Actuator.
info.app.name=TwinSure Claims Service
info.app.description=Manages insured incidents, claims, evidence, and claim decisions
info.app.version=1.0.0

# Application logging.
logging.level.root=INFO
logging.level.org.example.claimsservice=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Reactive database logging.
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc.h2=DEBUG