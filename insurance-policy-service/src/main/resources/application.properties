spring.application.name=INSURANCE-POLICY-SERVICE

server.port=8084

# Persistent Reactive H2 Database
spring.r2dbc.url=r2dbc:h2:file:///./data/insurancepolicydb
spring.r2dbc.username=sa
spring.r2dbc.password=

# Execute database scripts during startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT validation
jwt.secret=thisismysecuresecretkeyfortwinsurejwtgeneration123456789
jwt.cookie.name=TWINSURE_TOKEN

# Reactive database logging
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc.h2=DEBUG



# Actuator monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Application information
management.info.env.enabled=true
info.app.name=TwinSure Insurance and Policy Service
info.app.description=Manages insurance products, underwriting, and issued policies
info.app.version=1.0.0

# Application logging
logging.level.root=INFO
logging.level.org.example.insurancepolicyservice=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO