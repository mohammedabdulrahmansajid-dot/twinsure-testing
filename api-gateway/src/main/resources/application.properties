# Identifies the Gateway in Eureka and runs it on the frontend-facing port.
spring.application.name=API-GATEWAY
server.port=8080

# Eureka registration and service discovery.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT validation settings shared with Identity Service.
jwt.secret=thisismysecuresecretkeyfortwinsurejwtgeneration123456789
jwt.cookie.name=TWINSURE_TOKEN

# Angular development origin.
app.cors.allowed-origin=http://localhost:4200

# Actuator monitoring endpoints.
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Allows the Gateway route Actuator endpoint to provide route information.
management.endpoint.gateway.access=read-only

# Application information exposed through Actuator.
info.app.name=TwinSure API Gateway
info.app.description=Routes and secures requests for TwinSure microservices
info.app.version=1.0.0

# Gateway and application logging.
logging.level.root=INFO
logging.level.org.example.apigateway=DEBUG
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=INFO
logging.level.reactor.netty.http.client=INFO