spring.application.name=IDENTITY-SERVICE

server.port=8081

# Reactive H2 Database
spring.r2dbc.url=r2dbc:h2:file:///./data/identitydb
spring.r2dbc.username=sa
spring.r2dbc.password=

# Execute schema.sql during startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT Configuration
jwt.secret=thisismysecuresecretkeyfortwinsurejwtgeneration123456789
jwt.expiration=3600000

# Reactive database logs
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc.h2=DEBUG


# JWT cookie configuration
jwt.cookie.name=TWINSURE_TOKEN
jwt.cookie.secure=false
jwt.cookie.same-site=Strict