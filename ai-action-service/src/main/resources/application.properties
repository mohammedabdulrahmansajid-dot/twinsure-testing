# Identifies this service in Eureka and runs it on the assigned port.
spring.application.name=AI-ACTION-SERVICE
server.port=8085

# Persistent reactive H2 database.
# Data remains available after restarting the service.
spring.r2dbc.url=r2dbc:h2:file:///./data/aiactiondb
spring.r2dbc.username=sa
spring.r2dbc.password=

# Executes schema.sql whenever the application starts.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# Eureka registration and service discovery.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT validation settings.
# The secret and cookie name must match Identity Service.
jwt.secret=thisismysecuresecretkeyfortwinsurejwtgeneration123456789
jwt.cookie.name=TWINSURE_TOKEN

# Actuator monitoring endpoints.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application information returned by /actuator/info.
info.app.name=TwinSure AI Action Evaluation Service
info.app.description=Simulates and evaluates AI Twin actions against configured rules
info.app.version=1.0.0

# Application logging.
logging.level.root=INFO
logging.level.org.example.aiactionservice=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Reactive database logging.
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc.h2=DEBUG